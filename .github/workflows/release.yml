name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.1.0. Leave empty to build and test every artifact and upload them as workflow artifacts only."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build universal DMG, publish release, update Homebrew cask
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Read the version from Cargo.toml
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check the tag matches Cargo.toml
        if: github.event_name == 'push' || github.event.inputs.tag != ''
        run: |
          test "v$VERSION" = "$TAG" || { echo "Tag $TAG does not match Cargo.toml version $VERSION"; exit 1; }

      - name: Build universal app and DMG
        run: UNIVERSAL=1 ./scripts/package.sh

      - name: Verify universal binary
        run: lipo -info "dist/Open Task Manager.app/Contents/MacOS/otm" | grep -q "x86_64 arm64"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenTaskManager-dmg
          path: dist/OpenTaskManager-${{ env.VERSION }}.dmg
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' || github.event.inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="dist/OpenTaskManager-$VERSION.dmg"
          shasum -a 256 "$DMG" | tee "$DMG.sha256"
          NOTES="$(awk "/^## \\[$VERSION\\]/{flag=1;next}/^## \\[/{flag=0}flag" CHANGELOG.md)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" "$DMG.sha256" --clobber
          else
            gh release create "$TAG" "$DMG" "$DMG.sha256" --title "Open Task Manager $VERSION" --notes "$NOTES"
          fi

      - name: Update Homebrew cask
        if: github.event_name == 'push' || github.event.inputs.tag != ''
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then echo "TAP_DEPLOY_KEY is not set; skipping the tap update"; exit 0; fi
          SHA="$(shasum -a 256 "dist/OpenTaskManager-$VERSION.dmg" | cut -d' ' -f1)"
          mkdir -p ~/.ssh && echo "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key && chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:elad12390/homebrew-tap.git tap
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$SHA/" packaging/open-task-manager.rb.in > tap/Casks/open-task-manager.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/open-task-manager.rb
          git diff --cached --quiet && { echo "Cask already up to date"; exit 0; }
          git commit -m "open-task-manager $VERSION"
          git push origin HEAD:main

  deb:
    name: .deb ${{ matrix.arch }}, install-tested
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Read the version from Cargo.toml
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check the tag matches Cargo.toml
        if: github.event_name == 'push' || github.event.inputs.tag != ''
        run: |
          test "v$VERSION" = "$TAG" || { echo "Tag $TAG does not match Cargo.toml version $VERSION"; exit 1; }

      - name: Build .deb in the Ubuntu 22.04 container
        run: ci/build-deb.sh

      - name: Install-test the .deb on Ubuntu 22.04, Ubuntu 24.04 and Debian 12
        run: ci/test-deb.sh dist

      - name: Checksum the .deb
        run: |
          # The build container writes dist/ as root.
          sudo chown -R "$(id -u):$(id -g)" dist
          cd dist
          DEB="$(ls open-task-manager_"$VERSION"-*_${{ matrix.arch }}.deb)"
          shasum -a 256 "$DEB" | tee "$DEB.sha256"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deb-${{ matrix.arch }}
          path: |
            dist/open-task-manager_*.deb
            dist/open-task-manager_*.deb.sha256
            dist/deb-test/
          if-no-files-found: ignore

      - name: Publish .deb to the GitHub release
        if: (github.event_name == 'push' || github.event.inputs.tag != '') && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          DEB="$(ls open-task-manager_"$VERSION"-*_${{ matrix.arch }}.deb)"
          gh release upload "$TAG" "$DEB" "$DEB.sha256" --clobber

  flatpak:
    name: Flatpak ${{ matrix.arch }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    # flatpak-builder lives in this image; the action does not install it.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Read the version from Cargo.toml
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check the tag matches Cargo.toml
        if: github.event_name == 'push' || github.event.inputs.tag != ''
        run: |
          test "v$VERSION" = "$TAG" || { echo "Tag $TAG does not match Cargo.toml version $VERSION"; exit 1; }

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: OpenTaskManager-${{ env.VERSION }}-${{ matrix.arch }}.flatpak
          manifest-path: packaging/flatpak/io.github.elad12390.open_task_manager.OpenTaskManager.yml
          cache-key: flatpak-builder-${{ github.sha }}-${{ matrix.arch }}
          arch: ${{ matrix.arch }}
          upload-artifact: false

      - name: Lint the manifest, MetaInfo and repo
        run: |
          # flatpak-spawn access is the one expected finding: Flathub grants it per app (see FLATHUB.md).
          ex=packaging/flatpak/lint-exceptions.json
          flatpak-builder-lint --exceptions --user-exceptions "$ex" manifest packaging/flatpak/io.github.elad12390.open_task_manager.OpenTaskManager.yml
          flatpak-builder-lint --exceptions --user-exceptions "$ex" appstream packaging/linux/io.github.elad12390.open_task_manager.OpenTaskManager.metainfo.xml
          flatpak-builder-lint --exceptions --user-exceptions "$ex" repo repo

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: OpenTaskManager-*.flatpak

  flatpak-test:
    name: Flatpak ${{ matrix.arch }}, install-tested in Fedora
    needs: flatpak
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Read the version from Cargo.toml
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}

      - name: Install-test the bundle in Fedora and run the selftest
        run: ci/test-flatpak-install.sh "OpenTaskManager-${VERSION}-${{ matrix.arch }}.flatpak"

      - name: Checksum the .flatpak
        run: |
          BUNDLE="OpenTaskManager-$VERSION-${{ matrix.arch }}.flatpak"
          shasum -a 256 "$BUNDLE" | tee "$BUNDLE.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}-tested
          path: |
            OpenTaskManager-*.flatpak
            OpenTaskManager-*.flatpak.sha256

      - name: Publish .flatpak to the GitHub release
        if: (github.event_name == 'push' || github.event.inputs.tag != '') && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUNDLE="OpenTaskManager-$VERSION-${{ matrix.arch }}.flatpak"
          gh release upload "$TAG" "$BUNDLE" "$BUNDLE.sha256" --clobber

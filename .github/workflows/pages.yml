name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "assets/AppIcon.png", "assets/demo/**", "packaging/linux/screenshots/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add the app icon, demo GIFs and Linux screenshots to the site
        run: |
          cp assets/AppIcon.png site/icon.png
          mkdir -p site/demo site/linux
          cp assets/demo/*.gif site/demo/
          cp packaging/linux/screenshots/*.png site/linux/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

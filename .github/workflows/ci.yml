name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Lint, test and package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: UI tests
        run: cargo test

      - name: Package app and DMG
        run: ./scripts/package.sh

      - name: Verify bundle
        run: |
          codesign --verify --verbose=2 "dist/Open Task Manager.app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "dist/Open Task Manager.app/Contents/Info.plist"
          hdiutil imageinfo dist/OpenTaskManager-*.dmg | grep -E '^Format:'

      - uses: actions/upload-artifact@v7
        with:
          name: OpenTaskManager-dmg
          path: dist/*.dmg
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }} (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang mold cmake \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev mesa-vulkan-drivers \
            libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libfontconfig-dev libfreetype-dev libzstd-dev \
            libssl-dev libasound2-dev libdbus-1-dev \
            xvfb xdotool imagemagick dbus-x11

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: UI tests
        run: xvfb-run -a cargo test

      - name: Build and selftest
        run: |
          cargo build
          target/debug/otm --selftest

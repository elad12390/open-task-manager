[package]
name = "open-task-manager"
version = "0.2.1"
edition = "2024"
description = "Open-source, local-only macOS system monitor (GPUI)"
license = "Apache-2.0"

[[bin]]
name = "otm"
path = "src/main.rs"

[dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
sysinfo = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
resvg = { version = "0.45", default-features = false }

[dev-dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders", "test-support"] }

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2

# xattr 0.2.3 (pulled in by gpui's HTTP client) uses libc::ENOATTR, which current libc no longer
# defines on Linux. patches/xattr is 0.2.3 with that one constant fixed.
[patch.crates-io]
xattr = { path = "patches/xattr" }

[package]
name = "open-task-manager"
version = "0.2.0"
edition = "2024"
description = "Open-source, local-only macOS system monitor (GPUI)"
license = "Apache-2.0"

[[bin]]
name = "otm"
path = "src/main.rs"

[dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
sysinfo = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders", "test-support"] }

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2
